<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>업무 관리</title>
<style>
  /* 기본 초기화 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* 시스템 폰트 스택 적용 및 기본 배경색 지정 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", "Noto Sans KR", Roboto, sans-serif;
    background-color: #f5f7fa;
    color: #333;
    min-height: 100vh;
    display: flex;
  }

  /* 좌측 사이드바: 고정 폭 200px, 짙은 남색 배경, 흰 글자 */
  .sidebar {
    width: 200px;
    min-height: 100vh;
    background-color: #2c3e50;
    color: #ffffff;
    padding: 24px 0;
    flex-shrink: 0;
  }

  /* 사이드바 로고/제목 영역 */
  .sidebar-title {
    font-size: 18px;
    font-weight: 700;
    padding: 0 20px 20px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 12px;
  }

  /* 메뉴 리스트 */
  .menu {
    list-style: none;
  }

  /* 메뉴 항목: 텍스트만 표시 */
  .menu li {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.15s ease;
  }

  /* 메뉴 호버 효과 */
  .menu li:hover {
    background-color: rgba(255, 255, 255, 0.08);
  }

  /* 우측 메인 영역: 남은 공간을 모두 차지 */
  .main {
    flex: 1;
    padding: 32px;
    min-height: 100vh;
  }
</style>
</head>
<body>
  <!-- 좌측 사이드바: 네비게이션 메뉴 -->
  <aside class="sidebar">
    <div class="sidebar-title">업무 관리</div>
    <ul class="menu">
      <li>일일 스크럼</li>
      <li>프로젝트 보드</li>
      <li>월별 로깅</li>
      <li>기간별 블록</li>
    </ul>
  </aside>

  <!-- 우측 메인 영역: 현재는 비어 있음 -->
  <main class="main"></main>

<script>
  // 메뉴 클릭 시 콘솔에 선택된 항목 출력 (추후 라우팅 연결 예정)
  document.querySelectorAll('.menu li').forEach(function(item) {
    item.addEventListener('click', function() {
      console.log('선택된 메뉴:', item.textContent);
    });
  });
</script>
</body>
</html>
