<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>업무 관리</title>
<style>
  /* 기본 초기화 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* 시스템 폰트 스택 적용 및 기본 배경색 지정 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", "Noto Sans KR", Roboto, sans-serif;
    background-color: #f5f7fa;
    color: #333;
    min-height: 100vh;
    display: flex;
  }

  /* 좌측 사이드바: 고정 폭 200px, 짙은 남색 배경, 흰 글자 */
  .sidebar {
    width: 200px;
    min-height: 100vh;
    background-color: #2c3e50;
    color: #ffffff;
    padding: 24px 0;
    flex-shrink: 0;
  }

  /* 사이드바 로고/제목 영역 */
  .sidebar-title {
    font-size: 18px;
    font-weight: 700;
    padding: 0 20px 20px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 12px;
  }

  /* 메뉴 리스트 */
  .menu {
    list-style: none;
  }

  /* 메뉴 항목: 텍스트만 표시 */
  .menu li {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.15s ease;
  }

  /* 메뉴 호버 효과 */
  .menu li:hover {
    background-color: rgba(255, 255, 255, 0.08);
  }

  /* 현재 선택된 메뉴 강조: 배경색을 밝은 파랑으로 변경 */
  .menu li.active {
    background-color: #3498db;
    font-weight: 600;
  }

  /* 우측 메인 영역: 남은 공간을 모두 차지 */
  .main {
    flex: 1;
    padding: 32px;
    min-height: 100vh;
  }

  /* 각 페이지 패널: 기본은 숨김 */
  .page {
    display: none;
  }

  /* 활성화된 페이지만 표시 */
  .page.active {
    display: block;
  }

  /* 페이지 타이틀 여백 (초기화로 margin:0 된 h1 복원) */
  .page h1 {
    font-size: 24px;
    margin-bottom: 12px;
  }

  /* ── 일일 스크럼 뷰 ── */

  /* 날짜 + 저장 표시 라인 */
  .scrum-date {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #667085;
    margin-bottom: 24px;
  }

  /* "저장됨" 표시: 기본은 투명, .visible 일 때 나타남 */
  .scrum-saved {
    font-size: 12px;
    color: #27ae60;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .scrum-saved.visible {
    opacity: 1;
  }

  /* 한 필드 묶음: 라벨 + textarea */
  .scrum-field-group {
    margin-bottom: 20px;
    max-width: 720px;
  }

  .scrum-field-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
  }

  .scrum-field-group textarea {
    width: 100%;
    min-height: 96px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: inherit;
    background-color: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    resize: vertical;
  }

  .scrum-field-group textarea:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.15);
  }

  /* 다크모드용 폼 요소 색상 */
  body.dark .scrum-date {
    color: #9aa4b2;
  }

  body.dark .scrum-field-group label {
    color: #c0c6d0;
  }

  body.dark .scrum-field-group textarea {
    background-color: #2a2f38;
    border-color: #3d4451;
    color: #e0e0e0;
  }

  body.dark .scrum-field-group textarea:focus {
    border-color: #3498db;
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.25);
  }

  /* 우측 상단 툴바: 백업/다크모드 버튼 묶음 */
  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    z-index: 100;
  }

  /* 툴바 버튼 공통 스타일 */
  .toolbar button {
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    color: #333;
    background-color: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .toolbar button:hover {
    background-color: #f0f3f6;
    border-color: #a8b1bd;
  }

  /* 다크모드: body에 .dark 클래스가 붙으면 전체 색상 반전 */
  body.dark {
    background-color: #1a1d23;
    color: #e0e0e0;
  }

  body.dark .sidebar {
    background-color: #0f1419;
  }

  body.dark .toolbar button {
    background-color: #2a2f38;
    color: #e0e0e0;
    border-color: #3d4451;
  }

  body.dark .toolbar button:hover {
    background-color: #353b46;
    border-color: #525a6a;
  }
</style>
</head>
<body>
  <!-- 좌측 사이드바: 네비게이션 메뉴. data-target으로 연결될 페이지 지정 -->
  <aside class="sidebar">
    <div class="sidebar-title">업무 관리</div>
    <ul class="menu">
      <li data-target="scrum">일일 스크럼</li>
      <li data-target="board">프로젝트 보드</li>
      <li data-target="monthly">월별 로깅</li>
      <li data-target="period">기간별 블록</li>
    </ul>
  </aside>

  <!-- 우측 상단 툴바: 백업 다운로드/불러오기 + 다크모드 토글 -->
  <div class="toolbar">
    <button id="btn-backup-download">백업 다운로드</button>
    <button id="btn-backup-upload">백업 불러오기</button>
    <button id="btn-dark-toggle">다크모드</button>
  </div>

  <!-- 우측 메인 영역: 4개 페이지 패널, 활성화된 것만 표시 -->
  <main class="main">
    <div class="page" data-page="scrum">
      <h1>일일 스크럼</h1>
      <div class="scrum-date">
        <span id="scrum-date-text"></span>
        <span id="scrum-saved" class="scrum-saved">저장됨</span>
      </div>
      <div class="scrum-field-group">
        <label for="scrum-yesterday">어제 한 일</label>
        <textarea id="scrum-yesterday" class="scrum-field" placeholder="어제 완료한 일을 적어주세요"></textarea>
      </div>
      <div class="scrum-field-group">
        <label for="scrum-today">오늘 할 일</label>
        <textarea id="scrum-today" class="scrum-field" placeholder="오늘 진행할 일을 적어주세요"></textarea>
      </div>
      <div class="scrum-field-group">
        <label for="scrum-blockers">블로커</label>
        <textarea id="scrum-blockers" class="scrum-field" placeholder="진행을 가로막는 이슈가 있다면 적어주세요"></textarea>
      </div>
    </div>
    <div class="page" data-page="board"><h1>프로젝트 보드</h1></div>
    <div class="page" data-page="monthly"><h1>월별 로깅</h1></div>
    <div class="page" data-page="period"><h1>기간별 블록</h1></div>
  </main>

<script>
  // ─────────────────────────────────────────────────────────────
  // localStorage 데이터 관리
  // ─────────────────────────────────────────────────────────────

  // 4개 키와 각 키의 기본값 정의. 저장된 값이 없거나 손상된 경우 이 값을 사용
  var STORAGE_DEFAULTS = {
    kr_scrums:      {},                      // 일일 스크럼 기록 (날짜 키 → 항목)
    kr_projects:    [],                      // 프로젝트 보드 항목 목록
    kr_daily_tasks: [],                      // 일별 태스크 목록
    kr_settings:    { darkMode: false }      // 사용자 설정(테마 등)
  };

  // 기본값 깊은 복사(원본 오염 방지). 배열/객체 중첩이 얕아서 JSON 복사로 충분
  function cloneDefault(key) {
    return JSON.parse(JSON.stringify(STORAGE_DEFAULTS[key]));
  }

  // 저장된 값 읽기. 없거나 파싱 실패 시 기본값 반환
  function getData(key) {
    if (!(key in STORAGE_DEFAULTS)) {
      throw new Error('알 수 없는 저장소 키: ' + key);
    }
    var raw = localStorage.getItem(key);
    if (raw === null) return cloneDefault(key);
    try {
      return JSON.parse(raw);
    } catch (e) {
      return cloneDefault(key);
    }
  }

  // 값 저장. JSON 문자열로 직렬화
  function setData(key, value) {
    if (!(key in STORAGE_DEFAULTS)) {
      throw new Error('알 수 없는 저장소 키: ' + key);
    }
    localStorage.setItem(key, JSON.stringify(value));
  }

  // ─────────────────────────────────────────────────────────────
  // 백업 다운로드 / 불러오기
  // ─────────────────────────────────────────────────────────────

  // 현재 저장된 모든 키를 하나의 JSON 파일로 내보내기
  function downloadBackup() {
    var backup = {};
    Object.keys(STORAGE_DEFAULTS).forEach(function(key) {
      backup[key] = getData(key);
    });

    var json = JSON.stringify(backup, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);

    // 파일명에 오늘 날짜 포함 (YYYY-MM-DD)
    var today = new Date().toISOString().slice(0, 10);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'kr-backup-' + today + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // 사용자가 선택한 JSON 파일을 읽어 localStorage에 반영
  function uploadBackup() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';

    input.addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          // 알려진 키만 덮어쓰기 (알 수 없는 키는 무시)
          Object.keys(STORAGE_DEFAULTS).forEach(function(key) {
            if (data[key] !== undefined) setData(key, data[key]);
          });
          // 설정이 바뀌었을 수 있으므로 테마 재적용
          applyDarkMode();
          alert('백업을 불러왔습니다.');
        } catch (err) {
          alert('올바른 JSON 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    });

    input.click();
  }

  // ─────────────────────────────────────────────────────────────
  // 다크모드
  // ─────────────────────────────────────────────────────────────

  // 현재 설정 값에 따라 body에 .dark 클래스 토글
  function applyDarkMode() {
    var settings = getData('kr_settings');
    document.body.classList.toggle('dark', !!settings.darkMode);
  }

  // 다크모드 on/off 전환 후 설정에 저장
  function toggleDarkMode() {
    var settings = getData('kr_settings');
    settings.darkMode = !settings.darkMode;
    setData('kr_settings', settings);
    applyDarkMode();
  }

  // 툴바 버튼 이벤트 바인딩
  document.getElementById('btn-backup-download').addEventListener('click', downloadBackup);
  document.getElementById('btn-backup-upload').addEventListener('click', uploadBackup);
  document.getElementById('btn-dark-toggle').addEventListener('click', toggleDarkMode);

  // 페이지 로드 시 저장된 테마 적용
  applyDarkMode();

  // ─────────────────────────────────────────────────────────────
  // 사이드바 네비게이션 (기존 로직)
  // ─────────────────────────────────────────────────────────────

  // 메뉴 항목과 페이지 패널 캐싱
  var menuItems = document.querySelectorAll('.menu li');
  var pages = document.querySelectorAll('.page');

  // 특정 타겟 키로 메뉴/페이지를 활성화하는 함수
  function activate(target) {
    menuItems.forEach(function(item) {
      item.classList.toggle('active', item.dataset.target === target);
    });
    pages.forEach(function(page) {
      page.classList.toggle('active', page.dataset.page === target);
    });
  }

  // 메뉴 클릭 시 해당 페이지로 전환
  menuItems.forEach(function(item) {
    item.addEventListener('click', function() {
      activate(item.dataset.target);
    });
  });

  // Cmd(Mac)/Ctrl(Win) + 1~4 키보드 단축키로 전환
  document.addEventListener('keydown', function(e) {
    // 조합 키가 눌리지 않았으면 무시
    if (!(e.metaKey || e.ctrlKey)) return;
    // Shift/Alt가 함께 눌리면 브라우저 단축키와 충돌 가능하므로 제외
    if (e.shiftKey || e.altKey) return;

    var index = parseInt(e.key, 10);
    if (index >= 1 && index <= menuItems.length) {
      // 브라우저 기본 동작(탭 전환 등) 방지
      e.preventDefault();
      activate(menuItems[index - 1].dataset.target);
    }
  });

  // 초기 진입 시 첫 번째 메뉴를 기본 선택
  activate(menuItems[0].dataset.target);

  // ─────────────────────────────────────────────────────────────
  // 일일 스크럼 뷰: 날짜 표시 + 자동 저장 폼
  // ─────────────────────────────────────────────────────────────

  // 오늘 날짜를 "YYYY-MM-DD" 형식의 저장 키로 변환
  function todayKey() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  // "2026년 4월 23일 목요일" 형식의 사람 읽기용 날짜 문자열
  function formatKoreanDate() {
    var d = new Date();
    var week = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + week[d.getDay()];
  }

  // 스크럼 폼 요소 캐싱
  var scrumFields = {
    yesterday: document.getElementById('scrum-yesterday'),
    today:     document.getElementById('scrum-today'),
    blockers:  document.getElementById('scrum-blockers')
  };
  var scrumSavedEl = document.getElementById('scrum-saved');
  var scrumDateEl  = document.getElementById('scrum-date-text');

  // 날짜 라벨 채우기
  scrumDateEl.textContent = formatKoreanDate();

  // 오늘 날짜의 저장된 스크럼을 로드해서 textarea에 채워 넣기
  function loadTodayScrum() {
    var scrums = getData('kr_scrums');
    var entry = scrums[todayKey()] || {};
    scrumFields.yesterday.value = entry.yesterday || '';
    scrumFields.today.value     = entry.today     || '';
    scrumFields.blockers.value  = entry.blockers  || '';
  }

  // "저장됨" 표시를 잠깐 보여줬다 숨김. 연타 시 타이머 리셋
  var savedHideTimer = null;
  function flashSavedIndicator() {
    scrumSavedEl.classList.add('visible');
    clearTimeout(savedHideTimer);
    savedHideTimer = setTimeout(function() {
      scrumSavedEl.classList.remove('visible');
    }, 1200);
  }

  // 현재 입력 값을 오늘 날짜 키 아래에 저장
  function saveTodayScrum() {
    var scrums = getData('kr_scrums');
    scrums[todayKey()] = {
      yesterday: scrumFields.yesterday.value,
      today:     scrumFields.today.value,
      blockers:  scrumFields.blockers.value,
      updatedAt: new Date().toISOString()
    };
    setData('kr_scrums', scrums);
    flashSavedIndicator();
  }

  // 입력 이벤트에 디바운스를 걸어 과도한 저장 방지 (300ms)
  var saveDebounceTimer = null;
  function scheduleSave() {
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(saveTodayScrum, 300);
  }

  // 세 textarea에 input 이벤트 바인딩
  Object.keys(scrumFields).forEach(function(k) {
    scrumFields[k].addEventListener('input', scheduleSave);
  });

  // 초기 로드: 오늘 저장본 복원
  loadTodayScrum();
</script>
</body>
</html>
